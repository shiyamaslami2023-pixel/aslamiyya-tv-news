<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aslamiyya Knowledge News</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#06101d;
 color:#fff;
 font-family:Arial,"Noto Sans Tamil",sans-serif;
}

#newsScreen{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 background:linear-gradient(135deg,#06101d,#0a1830);
}

header{
 height:120px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:18px 55px;
 border-bottom:1px solid rgba(255,255,255,.12);
}

.brand{
 display:flex;
 align-items:center;
 gap:18px;
}

.brand img{
 width:76px;
 height:76px;
 border-radius:50%;
 object-fit:cover;
}

.brand h1{
 margin:0;
 font-size:30px;
 letter-spacing:1.5px;
}

.brand p{
 margin:7px 0 0;
 font-size:13px;
 letter-spacing:3px;
 color:#c7ccd5;
}

.clock{
 text-align:right;
}

#time{
 font-size:32px;
 font-weight:800;
}

#date{
 margin-top:5px;
 color:#d8b35b;
 font-size:14px;
}

.main{
 flex:1;
 display:grid;
 grid-template-columns:260px 1fr;
 min-height:0;
}

.side{
 padding:55px 35px;
 border-right:1px solid rgba(255,255,255,.1);
}

.sideSmall{
 color:#d8b35b;
 font-size:13px;
 font-weight:700;
}

.sideTitle{
 font-size:48px;
 font-weight:900;
 line-height:1.05;
 margin-top:20px;
}

.sideText{
 margin-top:250px;
 color:#aab2c0;
 line-height:1.6;
 font-size:14px;
}

.stage{
 display:grid;
 grid-template-columns:1.05fr .95fr;
 gap:45px;
 align-items:center;
 padding:45px 60px;
 min-height:0;
}

.category{
 display:inline-block;
 border:1px solid #d8b35b;
 color:#d8b35b;
 padding:9px 16px;
 font-weight:800;
 margin-bottom:25px;
}

#headline{
 font-size:52px;
 line-height:1.22;
 margin:0;
 max-width:800px;
}

.goldLine{
 width:105px;
 height:5px;
 background:#d8b35b;
 margin:32px 0 25px;
}

#detail{
 color:#b8c0cd;
 font-size:20px;
 line-height:1.55;
}

.photoBox{
 position:relative;
 height:500px;
 overflow:hidden;
 border-radius:20px;
 background:#111c2c;
}

#photo{
 width:100%;
 height:100%;
 object-fit:cover;
}

#source{
 position:absolute;
 bottom:20px;
 left:20px;
 background:rgba(4,12,24,.85);
 border-left:4px solid #d8b35b;
 padding:10px 14px;
 font-size:12px;
}

.ticker{
 height:70px;
 display:flex;
 align-items:center;
 background:#f2efe6;
 color:#06101d;
 overflow:hidden;
}

.tickerLabel{
 height:100%;
 min-width:220px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#d8b35b;
 font-weight:900;
}

.tickerTrack{
 white-space:nowrap;
 font-size:18px;
 font-weight:700;
 animation:scroll 35s linear infinite;
 padding-left:100%;
}

@keyframes scroll{
 from{transform:translateX(0)}
 to{transform:translateX(-100%)}
}

/* FULL SCREEN VIDEO */
#videoScreen{
 position:absolute;
 inset:0;
 background:#000;
 display:none;
 z-index:999;
}

#collegeVideo{
 width:100%;
 height:100%;
 object-fit:contain;
 background:#000;
}

.videoBadge{
 position:absolute;
 top:28px;
 left:32px;
 padding:10px 16px;
 background:rgba(6,16,29,.75);
 border-left:4px solid #d8b35b;
 font-weight:800;
 letter-spacing:1px;
}
</style>
</head>

<body>

<div id="newsScreen">

<header>
 <div class="brand">
  <img src="logo.jpeg">
  <div>
   <h1>ASLAMIYYA ARABIC COLLEGE</h1>
   <p>KADAYANALLUR · TODAY'S TOP 5</p>
  </div>
 </div>

 <div class="clock">
  <div id="time"></div>
  <div id="date"></div>
 </div>
</header>

<div class="main">

 <div class="side">
  <div class="sideSmall">மாணவர் அறிவுப் புதுப்பிப்பு</div>
  <div class="sideTitle">இன்றைய<br>TOP 5</div>

  <div class="sideText">
   உலகம், இந்தியா, அறிவியல், தொழில்நுட்பம் மற்றும்
   மாணவர்களுக்கு பயனுள்ள முக்கிய செய்திகள்.
  </div>
 </div>

 <div class="stage">

  <div>
   <div class="category" id="category">NEWS</div>
   <h2 id="headline"></h2>
   <div class="goldLine"></div>
   <div id="detail"></div>
  </div>

  <div class="photoBox">
   <img id="photo">
   <div id="source"></div>
  </div>

 </div>
</div>

<div class="ticker">
 <div class="tickerLabel">செய்தி வரிசை</div>
 <div class="tickerTrack" id="ticker"></div>
</div>

</div>


<!-- FULL SCREEN VIDEO -->
<div id="videoScreen">
 <div class="videoBadge">ASLAMIYYA VIDEO</div>
 <video
   id="collegeVideo"
   src="aslamiyya_video.mp4"
   muted
   playsinline
   preload="auto">
 </video>
</div>


<script src="news.js"></script>

<script>
let current = 0;
let timer = null;

const NEWS_TIME = 9500;

const newsScreen = document.getElementById("newsScreen");
const videoScreen = document.getElementById("videoScreen");
const video = document.getElementById("collegeVideo");

function showStory(i){
 const n = news[i];

 document.getElementById("category").textContent = n.category || "";
 document.getElementById("headline").textContent = n.headline || "";
 document.getElementById("detail").textContent = n.detail || "";
 document.getElementById("photo").src = n.image || "";
 document.getElementById("source").textContent = n.source || "";

 current = i;
}

function startNews(){
 clearTimeout(timer);

 video.pause();
 videoScreen.style.display = "none";
 newsScreen.style.display = "flex";

 current = 0;
 showStory(current);

 function next(){
   timer = setTimeout(function(){

     if(current < news.length - 1){
       current++;
       showStory(current);
       next();
     }else{
       startVideo();
     }

   }, NEWS_TIME);
 }

 next();
}

function startVideo(){
 clearTimeout(timer);

 newsScreen.style.display = "none";
 videoScreen.style.display = "block";

 video.currentTime = 0;
 video.muted = true;

 const playPromise = video.play();

 if(playPromise !== undefined){
   playPromise.catch(function(){
     /* Old TV fallback */
     setTimeout(startNews,120000);
   });
 }
}

video.addEventListener("ended",function(){
 startNews();
});

video.addEventListener("error",function(){
 setTimeout(startNews,3000);
});


function updateClock(){
 const d = new Date();

 document.getElementById("time").textContent =
   d.toLocaleTimeString("en-US");

 document.getElementById("date").textContent =
   d.toLocaleDateString("ta-IN",{
     weekday:"long",
     day:"numeric",
     month:"long",
     year:"numeric"
   });
}

setInterval(updateClock,1000);
updateClock();


if(typeof news !== "undefined" && news.length){
 document.getElementById("ticker").textContent =
   news.map(x => "◆  " + x.headline).join("     ");
 startNews();
}else{
 document.getElementById("headline").textContent =
   "News data loading...";
}
</script>

</body>
</html>
